apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: tachyon-api-server-template
spec:
  apps:
    - name: gha-api-server-sample
      repository:
        url: https://github.com/quantum-box/tachyon-api-server-template
        owner: quantum-box
        name: tachyon-api-server-template
        defaultBranch: main
      framework: serverless_functions
      deploymentTarget: lambda
      httpServing: true
      build:
        installCommand: npm ci --include=dev
        command: npm run build
        outputDirectory: lambda.zip
        nodeVersion: "22"
    - name: rust-api-server-sample
      repository:
        url: https://github.com/quantum-box/tachyon-api-server-template
        owner: quantum-box
        name: tachyon-api-server-template
        defaultBranch: main
      rootDirectory: apps/rust-api
      framework: cargo_lambda
      deploymentTarget: lambda
      httpServing: true
      build:
        installCommand: cargo fetch --locked
        command: cargo lambda build --release --bin rust-api
        outputDirectory: target/lambda/rust-api
        package: tachyon-rust-api-sample
        binary: rust-api
        release: true
        arch: x86_64
