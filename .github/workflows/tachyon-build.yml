name: Tachyon Cloud App build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Tachyon build ID
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: tachyon-build-${{ inputs.build_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pin the Action to the reviewed implementation commit before use.
      - uses: quantum-box/tachyon-ops-action/cloud-app-build@bd2469732cb5d62180c7b832a76e9abd94f35069
        with:
          build-id: ${{ inputs.build_id }}
